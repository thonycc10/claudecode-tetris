name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Evita loops: ignora ediciones hechas por bots
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Eres un asistente de triage de issues para este repositorio (Tetris en JS vanilla).
            Repositorio: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
            Evento: ${{ github.event.action }}

            ## Tareas

            1. Lee el issue con `gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}`.
            2. Lee `CLAUDE.md` y el código relevante (`game.js`, `index.html`, `style.css`) para entender el contexto.
            3. Lista los labels disponibles con `gh label list --repo ${{ github.repository }}`.
               Asigna SOLO labels que ya existan, con `gh issue edit`. Si el evento es `edited`,
               quita los labels que ya no apliquen y agrega los correctos.
            4. Publica UN solo comentario de diagnóstico. Debe empezar con la línea `<!-- claude-triage -->`. 
               - Revisa si ya existe con: `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments`
               - Si NO existe, créalo con: `gh issue comment ${{ github.event.issue.number }} --body "tu_comentario_aqui"`
               - Si YA existe, actualízalo con: `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body="tu_comentario_aqui"`
            5. NO modifiques código, NO crees ramas ni PRs. Solo labels y comentario.

            ## Formato del comentario (Markdown, en español)

            ```markdown
            <!-- claude-triage -->
            ## 🔍 Diagnóstico

            ### Resumen
            Una o dos frases.

            ### Tipo y labels
            - Tipo: bug | enhancement | question | ...
            - Labels asignados: `label1`, `label2`

            ### Causa probable
            Explicación con referencias a código, p. ej. `game.js:123` (`collide`).

            ### Archivos / funciones afectadas
            - `game.js` → `funcion()`

            ### Propuesta de solución
            1. Paso uno
            2. Paso dos

            ### Riesgos / casos borde
            - ...

            ### Información faltante
            - ... (omite la sección si no aplica)

            ### Complejidad estimada
            Baja | Media | Alta — justificación breve.
            ```

            Respeta el formato Markdown: headings, listas, bloques de código con lenguaje,
            tablas solo si aportan. Sé preciso y no inventes referencias a código que no hayas leído.
          claude_args: >-
            --allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh label list:*),Bash(gh api:*),Bash(gh issue comment:*),Read,Grep,Glob"
